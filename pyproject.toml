[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nevlan"
version = "0.7.0"
description = "Nevlan (ArthurOS) — agentic desktop automation operating system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Daniel Arturo Ramos" }]
keywords = ["automation", "agents", "desktop", "nevlan", "arthuros"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

# Keep base install empty; use extras so CI stays minimal.
dependencies = []

[project.optional-dependencies]
# Ubuntu CI / local gate: only what fase7 unit tests and validators import.
ci = [
    "pytest>=7.0",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "PyYAML>=6.0",
]

# Desktop UI, browser automation, vision (not installed in CI).
desktop = [
    "PyQt6>=6.5",
    "SpeechRecognition>=3.10",
    "Pillow>=10.0",
    "playwright>=1.40",
    "psutil>=5.9",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
]

# Windows-only automation (markers skip install on Linux CI).
windows = [
    "pywin32>=306; sys_platform == 'win32'",
    "pygetwindow>=0.0.9; sys_platform == 'win32'",
    "pyautogui>=0.9; sys_platform == 'win32'",
    "uiautomation>=2.0; sys_platform == 'win32'",
    "pynput>=1.7; sys_platform == 'win32'",
]

# Optional OCR backends (not installed in CI — lazy import at runtime).
vision = [
    "pytesseract>=0.3.10",
]

# Optional cloud LLM providers (keys via .env only).
llm = [
    "openai>=1.0",
    "httpx>=0.27",
    "groq>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
